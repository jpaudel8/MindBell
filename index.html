<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Awareness</title>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #060810; color: #7a88ac; font-family: sans-serif;">
        Loading Awareness...
      </div>
    </div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var root = document.getElementById('root');
        root.innerHTML = '<div style="color: white; padding: 20px; background: darkred;">' +
          '<h3>Critical Script Error</h3>' +
          '<p>' + msg + '</p>' +
          '<p>URL: ' + url + '</p>' +
          '</div>';
      };
    </script>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
